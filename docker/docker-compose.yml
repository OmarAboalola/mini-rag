services:
  pgvector:
    image: pgvector/pgvector:pg17

    container_name: pgvector

    ports:
      - "5433:5432"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres

    volumes:
      - pgvector_data:/var/lib/postgresql/data

    networks:
      - backend

    restart: always

networks:
  backend:

volumes:
  pgvector_data:
